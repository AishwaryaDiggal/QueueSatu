        let currentLang = 'en';
        window.toggleLanguage = function() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (translations[currentLang][key]) {
                    el.innerHTML = translations[currentLang][key];
                }
            });
        };

        window.switchView = function(viewName) {
            ['dashboard', 'alerts', 'ai-analysis', 'support'].forEach(v => {
                document.getElementById('view-' + v).classList.add('hidden');
            });
            document.getElementById('view-' + viewName).classList.remove('hidden');
            if (viewName === 'alerts') {
                updateLiveSignalStatus();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // --- REAL FIREBASE AUTHENTICATION (REGISTER / LOGIN) ---
        let currentUserEmail = null;
        let activeBooking = null;

        window.openAuthModal = function() {
            const email = prompt(currentLang === 'en' ? "Enter your email address for Login or Registration:" : "लॉगिन या पंजीकरण के लिए अपना ईमेल पता दर्ज करें:");
            if (!email) return;
            const password = prompt(currentLang === 'en' ? "Enter your password (min 6 characters):" : "अपना पासवर्ड दर्ज करें (न्यूनतम 6 वर्ण):");
            if (!password) return;

            // Attempt to login first, if user doesn't exist, automatically register them
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    handleSuccessfulAuth(userCredential.user.email);
                })
                .catch((error) => {
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                        // Automatically create account for smooth user onboarding
                        auth.createUserWithEmailAndPassword(email, password)
                            .then((newUserCredential) => {
                                alert(currentLang === 'en' ? "Account created and logged in successfully!" : "खाता बनाया गया और सफलतापूर्वक लॉगिन किया गया!");
                                handleSuccessfulAuth(newUserCredential.user.email);
                            })
                            .catch((regError) => {
                                alert("Auth Error: " + regError.message);
                            });
                    } else {
                        alert("Login Error: " + error.message);
                    }
                });
        };

        function handleSuccessfulAuth(email) {
            currentUserEmail = email;
            document.getElementById('auth-gate-overlay').classList.add('hidden');
            document.getElementById('auth-status-badge').textContent = email;
            document.getElementById('auth-status-badge').className = "bg-emerald-700 text-white px-2 py-0.5 rounded-full text-[10px]";
            document.getElementById('user-action-container').innerHTML = `
                <div class="flex items-center space-x-3">
                    <span class="text-xs text-slate-600 hidden sm:inline">👤 ${email}</span>
                    <button onclick="handleSignOut()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg transition font-medium">Sign Out</button>
                </div>
            `;
            // Check if user already has a booking stored in Firebase
            fetchUserBooking(email);
        }

        window.handleSignOut = function() {
            auth.signOut().then(() => {
                currentUserEmail = null;
                activeBooking = null;
                document.getElementById('auth-gate-overlay').classList.remove('hidden');
                document.getElementById('auth-status-badge').textContent = "Guest Session";
                document.getElementById('auth-status-badge').className = "bg-amber-800 text-amber-200 px-2 py-0.5 rounded-full text-[10px]";
                document.getElementById('user-action-container').innerHTML = `
                    <button onclick="openAuthModal()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg transition font-medium shadow-sm">Sign In / Register</button>
                `;
            });
        };

        // Listen to Firebase Auth state changes globally
        auth.onAuthStateChanged((user) => {
            if (user) {
                handleSuccessfulAuth(user.email);
            }
        });

        // --- MAP & HUB SETUP ---
        const map = L.map('map').setView([20.2961, 85.8245], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const hubs = [
            { name: "Unit 1 Market RMC", lat: 20.2724, lng: 85.8338 },
            { name: "Rasulgarh Agricultural Yard", lat: 20.3012, lng: 85.8576 },
            { name: "Khandagiri Wholesale Hub", lat: 20.2585, lng: 85.7831 },
            { name: "Mancheswar Storage Depot", lat: 20.3114, lng: 85.8422 }
        ];

        hubs.forEach(h => {
            L.marker([h.lat, h.lng]).addTo(map).bindPopup(`<b>${h.name}</b>`);
        });

        let currentHub = "Unit 1 Market RMC";
        window.selectHub = function(name, lat, lng) {
            currentHub = name;
            document.getElementById('selected-hub-name').textContent = name;
            map.setView([lat, lng], 14);
        };

        // --- REAL-TIME DATABASE QUEUE SYNCING ---
        window.handleBookingSubmit = function(event) {
            event.preventDefault();
            if (!currentUserEmail) {
                alert("Please sign in or register first to secure a slot.");
                openAuthModal();
                return;
            }

            const randomToken = "QS-BBS-" + Math.floor(100 + Math.random() * 900);
            const safeEmailKey = currentUserEmail.replace(/[.#$\/\[\]]/g, "_");

            activeBooking = {
                token: randomToken,
                email: currentUserEmail,
                name: document.getElementById('farmer-name').value,
                phone: document.getElementById('farmer-phone').value,
                location: currentHub,
                timing: document.getElementById('slot-time').value,
                timestamp: Date.now()
            };

            // Save booking keyed by sanitized user email in Firebase Database
            db.ref('user_bookings/' + safeEmailKey).set(activeBooking)
              .then(() => {
                  // Also log to general queue node for live counter visibility
                  db.ref('queue_ledger/' + randomToken).set(activeBooking);
                  
                  document.getElementById('token-display').textContent = randomToken;
                  document.getElementById('slot-booking-form').reset();
                  document.getElementById('booking-success-box').classList.remove('hidden');
              })
              .catch((error) => {
                  alert("Database Error: " + error.message);
              });
        };

        function fetchUserBooking(email) {
            const safeEmailKey = email.replace(/[.#$\/\[\]]/g, "_");
            db.ref('user_bookings/' + safeEmailKey).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    activeBooking = snapshot.val();
                    document.getElementById('token-display').textContent = activeBooking.token;
                    document.getElementById('booking-success-box').classList.remove('hidden');
                }
            });
        }

        window.updateLiveSignalStatus = function() {
            const light = document.getElementById('signal-light');
            const title = document.getElementById('signal-title');
            const instruction = document.getElementById('signal-instruction');
            const container = document.getElementById('signal-container');

            if (!activeBooking) {
                light.className = "w-6 h-6 rounded-full bg-slate-400 shrink-0";
                title.textContent = currentLang === 'en' ? "No Active Booking Found" : "कोई सक्रिय बुकिंग नहीं मिली";
                instruction.textContent = currentLang === 'en' ? "Please submit a booking from the dashboard to track your live queue status." : "अपनी लाइव कतार स्थिति को ट्रैक करने के लिए कृपया डैशबोर्ड से बुकिंग सबमिट करें।";
                container.className = "p-4 rounded-xl border mb-6 flex items-center space-x-4 bg-slate-50 border-slate-200";
                
                document.getElementById('alert-token').textContent = "--";
                document.getElementById('alert-location').textContent = "--";
                document.getElementById('alert-timing').textContent = "--";
                document.getElementById('alert-farmer').textContent = "--";
                return;
            }

            document.getElementById('alert-token').textContent = activeBooking.token;
            document.getElementById('alert-location').textContent = activeBooking.location;
            document.getElementById('alert-timing').textContent = activeBooking.timing;
            document.getElementById('alert-farmer').textContent = activeBooking.name + " (" + activeBooking.phone + ")";

            // Dynamic Time Window Signal Evaluation
            const currentHour = new Date().getHours();
            if (currentHour < 8) {
                light.className = "w-6 h-6 rounded-full bg-red-500 shrink-0 shadow-md shadow-red-300 animate-pulse";
                title.textContent = "🔴 RED SIGNAL: Prepare Crops & Bags at Farm";
                instruction.textContent = "Your slot is scheduled later. Ensure your crop sacks are stacked and weighed.";
                container.className = "p-4 rounded-xl border mb-6 flex items-center space-x-4 bg-red-50/60 border-red-200";
            } else if (currentHour >= 8 && currentHour <= 17) {
                light.className = "w-6 h-6 rounded-full bg-emerald-500 shrink-0 shadow-md shadow-emerald-300 animate-pulse";
                title.textContent = "🟢 GREEN SIGNAL: Proceed with Tractor to Yard Now";
                instruction.textContent = "Your window is active. Proceed directly to " + activeBooking.location + ".";
                container.className = "p-4 rounded-xl border mb-6 flex items-center space-x-4 bg-emerald-50/60 border-emerald-200";
            } else {
                light.className = "w-6 h-6 rounded-full bg-amber-500 shrink-0 shadow-md shadow-amber-300";
                title.textContent = "🟡 YELLOW SIGNAL: Slot Window Passed";
                instruction.textContent = "Your scheduled timing window has elapsed. Contact yard supervisor.";
                container.className = "p-4 rounded-xl border mb-6 flex items-center space-x-4 bg-amber-50/60 border-amber-200";
            }
        };

        window.simulateAIAnalysis = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('ai-loading').classList.remove('hidden');
            document.getElementById('ai-results-box').classList.add('hidden');

            setTimeout(() => {
                document.getElementById('ai-loading').classList.add('hidden');
                document.getElementById('ai-results-box').classList.remove('hidden');
            }, 1200);
        };
    </script>
